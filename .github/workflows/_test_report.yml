# Reports machine-readable Flutter test results from the caller workflows.
name: Test CI Report

on:
  workflow_run:
    workflows:
      - Check PR / Master
      - Manual Test
      - Publish to pub.dev
    types:
      - completed

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  report:
    name: Aggregate Flutter test reports
    runs-on: ubuntu-latest
    steps:
      - uses: dorny/test-reporter@v3
        with:
          artifact: flutter-test-results
          name: Flutter Tests
          path: "*_test.log"
          reporter: flutter-json
