name: flutter_adaptive_sidebar_example
description: Example app that switches Material and Cupertino sidebars.
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  cupertino_icons: ^1.0.8
  cupertino_ui: ^1.1.7
  flutter:
    sdk: flutter
  flutter_adaptive_sidebar:
    path: ../
  ios_window_control_layout: ^0.5.0
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
